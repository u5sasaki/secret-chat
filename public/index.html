<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>静岡用宗Ｂ邸ホワイトボード</title>
<style>
  :root {
    --bg: #7494c0;
    --green: #06c755;
    --header: #2b3a55;
    --bubble-me: #8de055;
    --bubble-other: #ffffff;
    --text: #1d1d1f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    background: var(--header);
    color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex: 0 0 auto;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 11px; opacity: .75; margin-top: 2px; }
  header button {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 14px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  #status { font-size: 11px; text-align: center; padding: 4px; background: #b5483f; color: #fff; display: none; }
  #list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .day {
    align-self: center;
    background: rgba(0,0,0,.25);
    color: #fff;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    margin: 4px 0;
  }
  .notice {
    align-self: center;
    background: rgba(255,255,255,.35);
    color: #1d2a40;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 10px;
    margin-bottom: 4px;
    text-align: center;
  }
  .row { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; }
  .row.me { flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    flex: 0 0 auto; color: #fff; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; justify-content: center; align-self: flex-start;
  }
  .row.me .avatar { display: none; }
  .col { display: flex; flex-direction: column; max-width: 72%; min-width: 0; }
  .row.me .col { align-items: flex-end; }
  .who { font-size: 11px; color: #f2f5fa; margin: 0 0 2px 4px; text-shadow: 0 1px 1px rgba(0,0,0,.2); }
  .line { display: flex; align-items: flex-end; gap: 5px; }
  .row.me .line { flex-direction: row-reverse; }
  .bubble {
    padding: 8px 12px;
    border-radius: 16px;
    background: var(--bubble-other);
    line-height: 1.45;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .row.me .bubble { background: var(--bubble-me); }
  .bubble.img { padding: 3px; background: transparent !important; }
  .bubble.img img {
    display: block; max-width: 100%; max-height: 320px; border-radius: 14px; cursor: pointer; background: #ddd;
  }
  .time { font-size: 10px; color: #eef2f8; white-space: nowrap; text-shadow: 0 1px 1px rgba(0,0,0,.2); }
  footer {
    background: #f1f2f4;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 6px; flex: 0 0 auto;
  }
  footer .iconbtn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; cursor: pointer;
    font-size: 22px; color: #555; flex: 0 0 auto;
  }
  #input {
    flex: 1 1 auto; resize: none; border: 1px solid #d5d7db; border-radius: 18px;
    padding: 9px 14px; font-size: 16px; font-family: inherit; max-height: 120px; line-height: 1.4;
    outline: none; background: #fff;
  }
  #send {
    background: var(--green); color: #fff; border: none; border-radius: 18px; padding: 0 16px; height: 38px;
    font-weight: 600; font-size: 14px; cursor: pointer; flex: 0 0 auto;
  }
  #send:disabled { opacity: .45; cursor: default; }
  #preview {
    display: none; background: #f1f2f4; padding: 8px 12px 0; flex: 0 0 auto; position: relative;
  }
  #preview img { max-height: 90px; border-radius: 8px; display: block; }
  #preview button {
    position: absolute; top: 2px; left: 6px; width: 22px; height: 22px; border-radius: 50%;
    border: none; background: #333; color: #fff; cursor: pointer; font-size: 12px;
  }
  /* 名前入力ダイアログ */
  #nameDlg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  #nameDlg .box { background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 340px; }
  #nameDlg h2 { margin: 0 0 6px; font-size: 18px; }
  #nameDlg p { margin: 0 0 14px; font-size: 13px; color: #666; }
  #nameDlg input {
    width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 12px;
  }
  #nameDlg button {
    width: 100%; padding: 11px; background: var(--green); color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  /* 画像拡大 */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none;
    align-items: center; justify-content: center; z-index: 20; padding: 12px;
  }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>静岡用宗Ｂ邸ホワイトボード</h1>
    <div class="sub" id="count">接続中…</div>
  </div>
  <button id="renameBtn" type="button">名前変更</button>
</header>
<div id="status">接続が切れました。再接続中…</div>
<div id="list" aria-live="polite"></div>
<div id="preview"><img id="previewImg" alt=""><button id="previewX" type="button" aria-label="画像を取り消す">✕</button></div>
<footer>
  <button class="iconbtn" id="photoBtn" type="button" aria-label="画像を選ぶ">🖼️</button>
  <input type="file" id="file" accept="image/*" hidden>
  <textarea id="input" rows="1" placeholder="メッセージを入力"></textarea>
  <button id="send" type="button" disabled>送信</button>
</footer>

<div id="nameDlg">
  <div class="box">
    <h2>名前を入力</h2>
    <p>チャットに表示される名前です（20文字まで）。</p>
    <input id="nameInput" maxlength="20" placeholder="例：たろう" autocomplete="nickname">
    <button id="nameOk" type="button">はじめる</button>
  </div>
</div>
<div id="lightbox"><img id="lightImg" alt=""></div>

<script>
(function () {
  var BASE = location.pathname.replace(/\/+$/, '');
  var list = document.getElementById('list');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var fileInput = document.getElementById('file');
  var statusEl = document.getElementById('status');
  var countEl = document.getElementById('count');
  var preview = document.getElementById('preview');
  var previewImg = document.getElementById('previewImg');

  var ls = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var cid = ls.get('cid');
  if (!cid) {
    cid = Math.random().toString(36).slice(2) + Date.now().toString(36);
    ls.set('cid', cid);
  }
  var myName = ls.get('name') || '';
  var ws = null, retry = 0, ready = false;
  var pendingImage = null; // {name, objectUrl}
  var uploading = false;
  var seen = {};
  var lastDay = '';

  // ---- 表示 ----
  var COLORS = ['#e57373', '#f06292', '#ba68c8', '#7986cb', '#4fc3f7', '#4db6ac', '#81c784', '#ffb74d', '#a1887f', '#90a4ae'];
  function colorFor(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dayLabel(ts) {
    var d = new Date(ts), t = new Date();
    var same = d.toDateString() === t.toDateString();
    return same ? '今日' : (d.getMonth() + 1) + '/' + d.getDate();
  }
  function nearBottom() { return list.scrollHeight - list.scrollTop - list.clientHeight < 120; }
  function toBottom() { list.scrollTop = list.scrollHeight; }

  function addNotice() {
    var n = document.createElement('div');
    n.className = 'notice';
    n.textContent = 'メッセージと画像は24時間で自動的に消えます';
    list.appendChild(n);
  }

  function addMessage(m) {
    if (seen[m.id]) return;
    seen[m.id] = true;
    var dl = dayLabel(m.ts);
    var dk = new Date(m.ts).toDateString();
    if (dk !== lastDay) {
      lastDay = dk;
      var dv = document.createElement('div');
      dv.className = 'day';
      dv.textContent = dl;
      list.appendChild(dv);
    }
    var mine = m.cid === cid;
    var row = document.createElement('div');
    row.className = 'row' + (mine ? ' me' : '');
    row.dataset.ts = m.ts;
    row.dataset.id = m.id;

    var av = document.createElement('div');
    av.className = 'avatar';
    av.style.background = colorFor(m.name);
    av.textContent = Array.from(m.name)[0] || '?';
    row.appendChild(av);

    var col = document.createElement('div');
    col.className = 'col';
    if (!mine) {
      var who = document.createElement('div');
      who.className = 'who';
      who.textContent = m.name;
      col.appendChild(who);
    }
    var line = document.createElement('div');
    line.className = 'line';
    var bodies = [];
    if (m.image) {
      var ib = document.createElement('div');
      ib.className = 'bubble img';
      var img = document.createElement('img');
      img.alt = '送信された画像';
      img.loading = 'lazy';
      img.src = BASE + '/img/' + encodeURIComponent(m.image);
      img.addEventListener('click', function () { openLightbox(img.src); });
      img.addEventListener('load', function () { if (stick) toBottom(); });
      ib.appendChild(img);
      bodies.push(ib);
    }
    if (m.text && m.text.trim()) {
      var tb = document.createElement('div');
      tb.className = 'bubble';
      tb.textContent = m.text;
      bodies.push(tb);
    }
    var stack = document.createElement('div');
    stack.style.display = 'flex';
    stack.style.flexDirection = 'column';
    stack.style.gap = '4px';
    stack.style.alignItems = mine ? 'flex-end' : 'flex-start';
    bodies.forEach(function (b) { stack.appendChild(b); });
    line.appendChild(stack);
    var tm = document.createElement('div');
    tm.className = 'time';
    tm.textContent = fmtTime(m.ts);
    line.appendChild(tm);
    col.appendChild(line);
    row.appendChild(col);
    list.appendChild(row);
  }
  var stick = true;

  function prune(before) {
    var rows = list.querySelectorAll('.row');
    rows.forEach(function (r) {
      if (Number(r.dataset.ts) < before) {
        delete seen[r.dataset.id];
        r.remove();
      }
    });
    // 空になった日付ラベルを消す
    var kids = Array.prototype.slice.call(list.children);
    kids.forEach(function (el, i) {
      if (el.classList.contains('day')) {
        var nx = kids[i + 1];
        if (!nx || !nx.classList.contains('row')) el.remove();
      }
    });
    lastDay = '';
    var lastRow = list.querySelector('.row:last-of-type');
    if (lastRow) lastDay = new Date(Number(lastRow.dataset.ts)).toDateString();
  }

  // ---- 接続 ----
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + BASE + '/ws');
    ws.onopen = function () { retry = 0; ready = true; statusEl.style.display = 'none'; updateSend(); };
    ws.onmessage = function (ev) {
      var d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.type === 'history') {
        stick = true;
        list.textContent = '';
        seen = {}; lastDay = '';
        addNotice();
        d.messages.forEach(addMessage);
        toBottom();
      } else if (d.type === 'msg') {
        stick = nearBottom() || d.message.cid === cid;
        addMessage(d.message);
        if (stick) toBottom();
      } else if (d.type === 'prune') {
        prune(d.before);
      } else if (d.type === 'presence') {
        countEl.textContent = d.count + '人がオンライン';
      }
    };
    ws.onclose = function () {
      ready = false;
      statusEl.style.display = 'block';
      countEl.textContent = '接続中…';
      updateSend();
      var wait = Math.min(10000, 1000 * Math.pow(2, retry++));
      setTimeout(connect, wait);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  // ---- 送信 ----
  function updateSend() {
    var has = input.value.trim().length > 0 || !!pendingImage;
    sendBtn.disabled = !(ready && has && !uploading && myName);
  }
  function send() {
    if (sendBtn.disabled) return;
    var payload = {
      type: 'msg', cid: cid, name: myName,
      text: input.value, image: pendingImage ? pendingImage.name : null
    };
    ws.send(JSON.stringify(payload));
    input.value = '';
    autoGrow();
    clearPending();
    updateSend();
    input.focus();
  }
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', function () { autoGrow(); updateSend(); });
  input.addEventListener('keydown', function (e) {
    // PCではEnterで送信、Shift+Enterで改行。変換確定中は送信しない。
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && window.matchMedia('(hover: hover)').matches) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  // ---- 画像 ----
  function clearPending() {
    if (pendingImage && pendingImage.objectUrl) URL.revokeObjectURL(pendingImage.objectUrl);
    pendingImage = null;
    preview.style.display = 'none';
    previewImg.removeAttribute('src');
  }
  document.getElementById('previewX').addEventListener('click', function () { clearPending(); updateSend(); });
  document.getElementById('photoBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (f) handleFile(f);
  });
  input.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) { e.preventDefault(); handleFile(f); return; }
      }
    }
  });

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      if (file.type === 'image/gif' && file.size < 8 * 1024 * 1024) return resolve(file);
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('blob')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }

  function handleFile(file) {
    if (!/^image\//.test(file.type)) { alert('画像ファイルを選んでください'); return; }
    uploading = true; updateSend();
    shrink(file).then(function (blob) {
      return fetch(BASE + '/upload', { method: 'POST', body: blob }).then(function (r) {
        if (!r.ok) throw new Error('upload ' + r.status);
        return r.json();
      }).then(function (j) {
        clearPending();
        var u = URL.createObjectURL(blob);
        pendingImage = { name: j.image, objectUrl: u };
        previewImg.src = u;
        preview.style.display = 'block';
      });
    }).catch(function () {
      alert('画像を送れませんでした。別の画像でお試しください。');
    }).then(function () {
      uploading = false; updateSend();
    });
  }

  // ---- 拡大表示 ----
  var lb = document.getElementById('lightbox');
  function openLightbox(src) { document.getElementById('lightImg').src = src; lb.style.display = 'flex'; }
  lb.addEventListener('click', function () { lb.style.display = 'none'; });

  // ---- 名前 ----
  var dlg = document.getElementById('nameDlg');
  var nameInput = document.getElementById('nameInput');
  function askName() {
    nameInput.value = myName;
    dlg.style.display = 'flex';
    setTimeout(function () { nameInput.focus(); }, 50);
  }
  function commitName() {
    var v = nameInput.value.trim().slice(0, 20);
    if (!v) return;
    myName = v;
    ls.set('name', v);
    dlg.style.display = 'none';
    updateSend();
    input.focus();
  }
  document.getElementById('nameOk').addEventListener('click', commitName);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) commitName();
  });
  document.getElementById('renameBtn').addEventListener('click', askName);

  if (!myName) askName();
  connect();
})();
</script>
</body>
</html>
